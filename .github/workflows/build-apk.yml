name: Build Android APK (base.apk)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build base.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android APK with Gradle
        working-directory: 01BulkEmailSender/android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare and Verify base.apk
        run: |
          echo "=== Locating built APK ==="
          find 01BulkEmailSender/android/app/build/outputs/apk -type f -name "*.apk"
          APK_PATH=$(find 01BulkEmailSender/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "Copying $APK_PATH to ./base.apk"
            cp "$APK_PATH" ./base.apk
            ls -la ./base.apk
          else
            echo "ERROR: Build completed but no APK was found!"
            exit 1
          fi

      - name: Upload base.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-apk
          path: ./base.apk
          retention-days: 14
